server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 location /api/catalog/ { proxy_pass http://catalog-api:4001/api/; }
 location /api/products/ { proxy_pass http://catalog-api:4001/api/products/; }
 location /api/orders { proxy_pass http://order-api:4002/api/orders; }
 location /api/inventory { proxy_pass http://inventory-api:4003/api/inventory; }
 location /api/demo/ { proxy_pass http://catalog-api:4001/api/demo/; }
 location /demo/ { proxy_pass http://catalog-api:4001/demo/; }
 location /health { return 200 'frontend ok'; add_header Content-Type text/plain; }
 location / { try_files $uri $uri/ /index.html; }
}