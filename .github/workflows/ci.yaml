name: Frontend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Validate frontend files
        run: |
          echo "Checking required frontend files..."

          test -f index.html
          test -f app.js
          test -f style.css
          test -f nginx.conf
          test -f Dockerfile

          echo "All required frontend files are present."

      - name: Set image tag
        id: image
        run: |
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.image }}
      

      - name: Checkout platform repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.PLATFORM_REPO }}
          token: ${{ secrets.PLATFORM_REPO_TOKEN }}
          path: platform

      - name: Install Kustomize
        run: |
          curl -sLo kustomize.tar.gz \
            https://github.com/kubernetes-sigs/kustomize/releases/latest/download/kustomize_linux_amd64.tar.gz
          tar -xzf kustomize.tar.gz
          sudo mv kustomize /usr/local/bin/kustomize

      - name: Update frontend image
        working-directory: platform
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kustomize edit set image \
            ghcr.io/${{ github.repository_owner }}/dd-ecom-frontend=ghcr.io/${{ github.repository_owner }}/dd-ecom-frontend:${IMAGE_TAG} \
            --kustomization kubernetes/frontend/kustomization.yaml

      - name: Commit platform update
        working-directory: platform
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add kubernetes/frontend/kustomization.yaml

          git diff --cached --quiet && exit 0

          git commit -m "chore: update frontend image to ${IMAGE_TAG}"
          git push
